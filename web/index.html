<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agente conversacional</title>
    <style>
      /*
        TEMA CLARO, y por que.

        Esto no es un chat de consumo: es una herramienta de trabajo
        administrativo. Se va a usar proyectada o compartida por pantalla,
        con tarjetas densas de datos y texto monoespaciado. Sobre claro se
        lee mejor en esas condiciones —un proyector lava los oscuros y el
        monoespaciado fino desaparece—, y es lo que la persona que hace
        este trabajo espera de un sistema de gestion.

        REGLA DEL COLOR: el color esta reservado para el ESTADO y para
        nada mas. No hay color de marca ni de acento. Lo que no es un
        estado es neutro.

          espera de aprobacion  ->  ambar
          ejecutado             ->  verde
          denegado o fallo      ->  rojo
          todo lo demas         ->  neutro

        Los nombres son del ESTADO, no del color, para poder cambiar el
        tema sin cazar valores por el archivo. Si manana el ambar pasa a
        ser morado, se cambia aqui y en ningun otro sitio.

        CONTRASTE: comprobado, no estimado. Todos los pares de texto
        superan 4.5:1 (AA para texto pequeno) y los bordes superan 3:1
        (componentes de interfaz). Los mas ajustados, que son los que
        importan porque son el texto pequeno y el monoespaciado:
          texto-tenue sobre superficie ....... 8.75
          barra de aprobacion, texto oscuro .. 8.84
          estado-espera como texto, blanco ... 5.93
          estado-neutro sobre lienzo ......... 5.41
          estado-ejecutado sobre su fondo .... 5.70
          estado-espera-borde contra lienzo .. 4.26
          borde sobre superficie ............. 3.09
      */
      :root {
        /* Superficies y texto. Sin color. */
        --lienzo: #f2f4f7;
        --superficie: #ffffff;
        --superficie-alta: #e7eaf0;
        --borde: #8b93a3;
        --texto: #0f1420;
        --texto-tenue: #434b5c;
        --relleno-neutro: #1f2937;

        /* ESTADO. El unico sitio donde hay color. */
        --estado-neutro: #5c6473;

        --estado-ejecutado: #0f6b38;
        --estado-ejecutado-fondo: #e3f2e9;

        --estado-fallo: #a8201a;
        --estado-fallo-fondo: #fbeae9;

        /* Ambar de verdad, tono 41, no marron. La barra NO lleva texto
           blanco: un ambar lo bastante brillante para parecerlo no puede
           sostener blanco encima con 4.5:1. Se invierte el contraste,
           relleno brillante con texto oscuro, y asi el color es ambar y
           el contraste sube en vez de bajar. */
        --estado-espera: #8a5a00;
        --estado-espera-fondo: #fef3c7;
        --estado-espera-borde: #9c6a00;
        --estado-espera-relleno: #f0a500;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--lienzo);
        color: var(--texto);
        font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
        display: flex;
        justify-content: center;
      }
      main {
        /* Ancho util: aprovecha la pantalla, con tope para que la linea
           siga siendo legible. */
        width: min(1180px, 100%);
        /* height, NO min-height. Con min-height main crecia con el
           contenido, la pagina entera se desplazaba y #historial nunca
           llegaba a ser el contenedor desplazable: por eso el bloque de
           aprobacion quedaba fuera de pantalla tras seis tarjetas. */
        height: 100dvh;
        max-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 16px;
        gap: 12px;
      }
      @supports not (height: 100dvh) {
        main {
          height: 100vh;
          max-height: 100vh;
        }
      }
      /* Ventana estrecha: sin margenes que roben ancho y burbujas a lo ancho. */
      @media (max-width: 640px) {
        main {
          padding: 10px;
          gap: 8px;
        }
        .burbuja {
          max-width: 100%;
        }
        #confirmacion {
          padding: 0 12px 12px;
        }
        /* El margen negativo de la barra tiene que seguir al relleno. */
        #confirmacion h2 {
          margin: 0 -12px 0;
          padding: 8px 12px;
        }
        .botones {
          flex-wrap: wrap;
        }
        .botones button {
          flex: 1 1 140px;
        }
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--borde);
        padding-bottom: 8px;
      }
      h1 {
        font-size: 17px;
        margin: 0;
        letter-spacing: 0.02em;
      }
      /* El contador y el enlace de sesion nueva CONVIVEN: antes el
         contador reemplazaba al enlace en cuanto empezaba la conversacion
         y no habia forma de empezar de cero. Van en la misma linea del
         encabezado, asi que no le quitan sitio al historial. */
      #cabecera-derecha {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      #estado {
        font-size: 13px;
        color: var(--texto-tenue);
        white-space: nowrap;
      }
      /* Con el aviso de cupo el texto es largo: tiene que poder envolver. */
      #estado.escaso {
        white-space: normal;
        text-align: right;
      }
      .enlace {
        font: inherit;
        font-size: 13px;
        background: none;
        border: none;
        padding: 0;
        color: var(--texto);
        cursor: pointer;
        text-decoration: underline;
        white-space: nowrap;
      }
      .enlace:hover:not(:disabled) {
        color: var(--estado-neutro);
      }
      .enlace:disabled {
        color: var(--texto-tenue);
        cursor: default;
        text-decoration: none;
      }
      .enlace.peligro {
        color: var(--estado-fallo);
      }
      #descartar-aviso {
        font-size: 13px;
        color: var(--estado-espera);
        white-space: nowrap;
      }
      #reinicio-confirmar[hidden],
      #reinicio[hidden],
      #descartar-aviso[hidden] {
        display: none;
      }
      #historial {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-right: 4px;
      }
      .burbuja {
        padding: 10px 14px;
        border-radius: 12px;
        max-width: 85%;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .usuario {
        align-self: flex-end;
        background: var(--relleno-neutro);
        color: var(--superficie);
        font-weight: 500;
      }
      .agente {
        align-self: flex-start;
        background: var(--superficie-alta);
        border: 1px solid var(--borde);
      }
      .tarjeta {
        align-self: stretch;
        background: var(--superficie);
        border: 1px solid var(--borde);
        border-left: 3px solid var(--estado-neutro);
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
      }
      .tarjeta.ok {
        border-left-color: var(--estado-ejecutado);
      }
      .tarjeta.fallo {
        border-left-color: var(--estado-fallo);
      }
      .tarjeta.no-corrio {
        border-left-color: var(--estado-espera);
      }
      .tarjeta .cabecera {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      .tarjeta .nombre {
        font-family: Consolas, "Courier New", monospace;
        font-weight: 600;
      }
      .tarjeta .marca {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--texto-tenue);
      }
      .tarjeta pre {
        margin: 6px 0 0;
        padding: 6px 8px;
        background: var(--superficie-alta);
        border: 1px solid var(--borde);
        border-radius: 6px;
        /* Salta de linea en vez de desplazarse: el evaluador tiene que
           poder LEER lo que devolvio cada llamada. */
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
        font-family: Consolas, "Courier New", monospace;
        font-size: 12px;
        color: var(--texto);
      }
      /* Resultados largos: plegados por defecto, desplegables de un clic. */
      .tarjeta details > summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--texto-tenue);
        margin-top: 6px;
        list-style: revert;
      }
      .tarjeta details[open] > summary {
        margin-bottom: 0;
      }
      .tarjeta details pre {
        max-height: 40vh;
        overflow-y: auto;
      }
      .error,
      .aviso {
        align-self: stretch;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
      }
      .error {
        background: var(--estado-fallo-fondo);
        border: 1px solid var(--estado-fallo);
      }
      .aviso {
        background: var(--estado-espera-fondo);
        border: 1px solid var(--estado-espera);
      }
      /* EL ELEMENTO MAS DESTACADO DE LA PANTALLA, y en claro hay que
         trabajarlo: el relleno ambar queda a 1.03 de contraste contra el
         lienzo, o sea que por si solo no separa nada. El peso lo dan el
         borde grueso (4.26 contra el lienzo) y la barra de titulo llena.
         Sin sombras: es estructura, no adorno. */
      #confirmacion {
        /* Pegado al fondo del area visible: aunque el historial sea largo,
           el control humano no puede quedar fuera de pantalla. */
        position: sticky;
        bottom: 0;
        z-index: 2;
        border: 3px solid var(--estado-espera-borde);
        background: var(--estado-espera-fondo);
        border-radius: 12px;
        padding: 0 16px 14px;
        display: none;
        flex-direction: column;
        gap: 10px;
        overflow: hidden;
      }
      #confirmacion.visible {
        display: flex;
      }
      /* Barra llena de lado a lado: texto oscuro sobre ambar brillante,
         8.84 de contraste. Es lo que hace que el bloque no se confunda
         con una tarjeta mas. */
      #confirmacion h2 {
        margin: 0 -16px 0;
        padding: 8px 16px;
        background: var(--estado-espera-relleno);
        color: var(--texto);
        font-size: 14px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      /* De que mensaje es esta aprobacion. Con seis seguidas, sin esto
         todas se ven iguales. */
      #accion-origen {
        font-family: Consolas, "Courier New", monospace;
        text-transform: none;
        letter-spacing: 0;
        font-weight: 700;
      }
      #accion-origen:empty {
        display: none;
      }
      /* Aviso de cupo: se refuerza con contraste y palabras, NO con
         color: el color esta reservado al estado de una llamada. */
      #estado.escaso {
        color: var(--texto);
        font-weight: 600;
      }
      #confirmacion .accion {
        font-family: Consolas, "Courier New", monospace;
        font-size: 15px;
        font-weight: 600;
      }
      /* Campo a campo, no un volcado JSON: es lo que la persona aprueba. */
      #accion-campos,
      .tarjeta .campos {
        margin: 0;
        padding: 8px 10px;
        background: var(--superficie);
        border: 1px solid var(--estado-espera-borde);
        border-radius: 6px;
        display: grid;
        grid-template-columns: minmax(0, max-content) minmax(0, 1fr);
        gap: 4px 14px;
        font-size: 13px;
        max-height: 34vh;
        overflow-y: auto;
      }
      #accion-campos dt,
      .tarjeta .campos dt {
        font-family: Consolas, "Courier New", monospace;
        color: var(--texto-tenue);
        white-space: nowrap;
      }
      #accion-campos dd,
      .tarjeta .campos dd {
        margin: 0;
        font-family: Consolas, "Courier New", monospace;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .tarjeta .campos {
        margin: 6px 0 0;
        font-size: 12px;
        max-height: none;
      }
      .nota-confirmacion {
        margin: 0;
        font-size: 12px;
        color: var(--texto-tenue);
      }
      .botones {
        display: flex;
        gap: 10px;
      }
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--borde);
        padding: 8px 16px;
        cursor: pointer;
        background: var(--superficie-alta);
        color: var(--texto);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #confirmar {
        background: var(--estado-ejecutado);
        border-color: var(--estado-ejecutado);
        color: var(--superficie);
        font-weight: 600;
      }
      #denegar {
        background: transparent;
        border-color: var(--estado-fallo);
        color: var(--estado-fallo);
        font-weight: 600;
      }
      form {
        display: flex;
        gap: 8px;
        border-top: 1px solid var(--borde);
        padding-top: 12px;
      }
      #entrada {
        flex: 1;
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--borde);
        background: var(--superficie);
        color: var(--texto);
      }
      #entrada:disabled {
        opacity: 0.5;
      }
      #enviar {
        background: var(--relleno-neutro);
        border-color: var(--relleno-neutro);
        color: var(--superficie);
        font-weight: 600;
      }
      #trabajando {
        display: none;
        align-items: center;
        gap: 8px;
        color: var(--texto-tenue);
        font-size: 13px;
      }
      #trabajando.visible {
        display: flex;
      }
      .punto {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--estado-neutro);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Agente conversacional</h1>
        <div id="cabecera-derecha">
          <span id="estado">sesion nueva</span>
          <button type="button" id="reinicio" class="enlace">
            Sesion nueva
          </button>
          <span id="descartar-aviso" hidden>¿Descartar esta conversacion?</span>
          <button
            type="button"
            id="reinicio-confirmar"
            class="enlace peligro"
            hidden
          >
            Si, descartar
          </button>
          <button type="button" id="reinicio-cancelar" class="enlace" hidden>
            Cancelar
          </button>
        </div>
      </header>

      <div id="historial"></div>

      <div id="trabajando"><span class="punto"></span> El agente esta trabajando...</div>

      <section id="confirmacion">
        <h2>
          <span>Esta accion necesita tu confirmacion</span>
          <span id="accion-origen"></span>
        </h2>
        <div class="accion" id="accion-nombre"></div>
        <dl id="accion-campos"></dl>
        <p class="nota-confirmacion">
          Revisa cada valor antes de aprobar: es exactamente esto lo que se
          ejecutara.
        </p>
        <div class="botones">
          <button id="confirmar" type="button">Confirmar y ejecutar</button>
          <button id="denegar" type="button">Denegar</button>
        </div>
      </section>

      <form id="formulario">
        <input
          id="entrada"
          type="text"
          autocomplete="off"
          placeholder="Escribe tu mensaje..."
        />
        <button id="enviar" type="submit">Enviar</button>
      </form>
    </main>

    <script>
      // El identificador de conversacion lo emite el SERVIDOR: aqui se
      // guarda el que devuelve y se reutiliza. El cliente no inventa ids.
      let sesionId = null;

      const historial = document.getElementById("historial");
      const trabajando = document.getElementById("trabajando");
      const bloque = document.getElementById("confirmacion");
      const accionNombre = document.getElementById("accion-nombre");
      const accionCampos = document.getElementById("accion-campos");
      const accionOrigen = document.getElementById("accion-origen");
      const entrada = document.getElementById("entrada");
      const enviar = document.getElementById("enviar");
      const formulario = document.getElementById("formulario");
      const estado = document.getElementById("estado");
      const reinicio = document.getElementById("reinicio");
      const avisoDescartar = document.getElementById("descartar-aviso");
      const reinicioConfirmar = document.getElementById("reinicio-confirmar");
      const reinicioCancelar = document.getElementById("reinicio-cancelar");

      let ocupado = false;
      let esperandoConfirmacion = null;

      /**
       * A que mensaje se refiere una llamada.
       *
       * Generico: si los argumentos traen un `mensaje_id` de tipo string,
       * se usa; si no, se devuelve "". El front NO sabe de contratos. Es
       * la misma convencion que ya usa el ciclo para escribir mensaje_id
       * en out/log.jsonl (RN7): una clave de nombre acordado, no un tipo
       * que este lado conozca.
       */
      function origenDe(argumentos) {
        if (argumentos === null || typeof argumentos !== "object") {
          return "";
        }
        const id = argumentos.mensaje_id;
        return typeof id === "string" ? id : "";
      }

      /**
       * El servidor manda los campos ya aplanados (ciclo.ts). Si por lo que
       * sea no llegan, se aplanan aqui con la misma forma: asi el bloque
       * nunca vuelve a caer en el volcado JSON.
       */
      function aplanar(valor, prefijo) {
        prefijo = prefijo || "";
        if (valor === null || typeof valor !== "object" || Array.isArray(valor)) {
          return [{ campo: prefijo, valor: JSON.stringify(valor) }];
        }
        const salida = [];
        for (const clave of Object.keys(valor)) {
          const ruta = prefijo === "" ? clave : prefijo + "." + clave;
          salida.push(...aplanar(valor[clave], ruta));
        }
        return salida;
      }

      function pintarCampos(destino, campos, argumentos) {
        const filas =
          Array.isArray(campos) && campos.length > 0
            ? campos
            : aplanar(argumentos);
        destino.replaceChildren();
        if (filas.length === 0) {
          const dt = document.createElement("dt");
          dt.textContent = "(sin argumentos)";
          destino.appendChild(dt);
          return;
        }
        for (const fila of filas) {
          const dt = document.createElement("dt");
          dt.textContent = fila.campo + ":";
          const dd = document.createElement("dd");
          dd.textContent = fila.valor;
          destino.appendChild(dt);
          destino.appendChild(dd);
        }
      }

      /**
       * Junta en UNA linea los campos que son hermanos hoja del mismo
       * objeto. Una llamada a contratos_validar con la extraccion entera
       * pintaba 53 renglones del estilo
       * "extraccion.campos.pais.confianza: 0.9", cuatro por cada campo del
       * contrato; asi son 14.
       *
       * La regla es por FORMA, no por nombre: si un objeto tiene todos sus
       * hijos como hojas, va en una linea. No dice nada de "campos" ni de
       * contratos, asi que cualquier herramienta con esa forma se
       * beneficia y el front sigue sin saber de que dominio habla.
       *
       * NO se renombra nada: fecha_inicio se sigue llamando fecha_inicio,
       * y la ruta completa se conserva a la izquierda. Es el nombre que
       * tiene en el maestro, en el esquema del PRD y en el CSV.
       *
       * NO se usa en el bloque de aprobacion: ahi cada valor va en su
       * renglon con la ruta entera, porque es lo que la persona aprueba.
       */
      function agruparHermanos(campos) {
        const salida = [];
        let i = 0;
        while (i < campos.length) {
          const corte = campos[i].campo.lastIndexOf(".");
          if (corte === -1) {
            salida.push(campos[i]);
            i += 1;
            continue;
          }
          const prefijo = campos[i].campo.slice(0, corte);
          let j = i;
          while (
            j < campos.length &&
            campos[j].campo.lastIndexOf(".") === corte &&
            campos[j].campo.slice(0, corte) === prefijo
          ) {
            j += 1;
          }
          if (j - i >= 2) {
            const partes = [];
            for (let k = i; k < j; k += 1) {
              partes.push(
                campos[k].campo.slice(corte + 1) + ": " + campos[k].valor,
              );
            }
            salida.push({ campo: prefijo, valor: partes.join("  ·  ") });
            i = j;
          } else {
            salida.push(campos[i]);
            i += 1;
          }
        }
        return salida;
      }

      /** Argumentos de una tarjeta informativa: agrupados y, si son
       *  muchos, plegados. Nada se pierde: todo esta tras un clic. */
      function argumentosDeTarjeta(campos, argumentos) {
        const agrupados = agruparHermanos(
          Array.isArray(campos) && campos.length > 0
            ? campos
            : aplanar(argumentos),
        );
        const lista = document.createElement("dl");
        lista.className = "campos";
        pintarCampos(lista, agrupados, argumentos);
        if (agrupados.length <= 10) {
          return lista;
        }
        const caja = document.createElement("details");
        const titulo = document.createElement("summary");
        titulo.textContent = "argumentos (" + agrupados.length + " entradas)";
        caja.appendChild(titulo);
        caja.appendChild(lista);
        return caja;
      }

      function listaDeCampos(campos, argumentos) {
        const lista = document.createElement("dl");
        lista.className = "campos";
        pintarCampos(lista, campos, argumentos);
        return lista;
      }

      function pintarEvento(evento) {
        const nodo = document.createElement("div");
        if (evento.tipo === "usuario" || evento.tipo === "agente") {
          nodo.className = "burbuja " + evento.tipo;
          nodo.textContent = evento.texto;
        } else if (evento.tipo === "error") {
          nodo.className = "error";
          nodo.textContent = evento.texto;
        } else if (evento.tipo === "aviso") {
          nodo.className = "aviso";
          nodo.textContent = evento.texto;
        } else if (evento.tipo === "pendiente") {
          nodo.className = "tarjeta no-corrio";
          nodo.innerHTML =
            '<div class="cabecera"><span class="nombre"></span>' +
            '<span class="marca">esperando confirmacion</span></div>';
          nodo.querySelector(".nombre").textContent = evento.nombre;
          nodo.appendChild(listaDeCampos(evento.campos, evento.argumentos));
        } else if (evento.tipo === "herramienta") {
          const clase =
            evento.disposicion !== "ejecutada"
              ? "no-corrio"
              : evento.ok
                ? "ok"
                : "fallo";
          const marca =
            evento.disposicion === "denegada"
              ? "denegada, no se ejecuto"
              : evento.disposicion === "pendiente"
                ? "pendiente, no se ejecuto"
                : evento.ok
                  ? "ok"
                  : "fallo";
          nodo.className = "tarjeta " + clase;
          nodo.innerHTML =
            '<div class="cabecera"><span class="nombre"></span>' +
            '<span class="marca"></span></div>';
          nodo.querySelector(".nombre").textContent = evento.nombre;
          nodo.querySelector(".marca").textContent = marca;
          // Tarjeta informativa de una llamada YA ejecutada: agrupada.
          // La del pendiente y el bloque de aprobacion no se tocan.
          nodo.appendChild(
            argumentosDeTarjeta(evento.campos, evento.argumentos),
          );
          const resultado = String(evento.resumen ?? "");
          const salida = document.createElement("pre");
          salida.textContent = resultado;
          if (resultado.length > 240) {
            // Largo: plegado, pero legible entero de un clic. Antes se
            // cortaba con barra horizontal y no habia forma de leerlo.
            const caja = document.createElement("details");
            const titulo = document.createElement("summary");
            titulo.textContent =
              "resultado (" + resultado.length + " caracteres)";
            caja.appendChild(titulo);
            caja.appendChild(salida);
            nodo.appendChild(caja);
          } else {
            const rotulo = document.createElement("div");
            rotulo.className = "marca";
            rotulo.textContent = "resultado";
            rotulo.style.marginTop = "6px";
            nodo.appendChild(rotulo);
            nodo.appendChild(salida);
          }
        } else {
          return;
        }
        historial.appendChild(nodo);
      }

      function pintar(vista) {
        historial.replaceChildren();
        for (const evento of vista.eventos) {
          pintarEvento(evento);
        }
        historial.scrollTop = historial.scrollHeight;

        esperandoConfirmacion = vista.esperandoConfirmacion;
        const yaEstaba = bloque.classList.contains("visible");
        if (esperandoConfirmacion) {
          accionNombre.textContent = esperandoConfirmacion.nombre;
          accionOrigen.textContent = origenDe(esperandoConfirmacion.argumentos);
          pintarCampos(
            accionCampos,
            esperandoConfirmacion.campos,
            esperandoConfirmacion.argumentos,
          );
          bloque.classList.add("visible");
          if (!yaEstaba) {
            // El control humano no puede quedar fuera de pantalla.
            requestAnimationFrame(function () {
              bloque.scrollIntoView({ behavior: "smooth", block: "center" });
            });
          }
        } else {
          bloque.classList.remove("visible");
        }

        const quedan = vista.mensajesPorSesion - vista.mensajesUsados;
        const base =
          vista.mensajesUsados + " de " + vista.mensajesPorSesion + " mensajes";
        // Nadie sabe que pasa al llegar al tope si no se lo dices antes.
        if (quedan <= 5) {
          estado.textContent =
            base +
            (quedan <= 0
              ? " · sin cupo: abre una sesion nueva para seguir"
              : " · quedan " +
                quedan +
                "; al agotarlas habra que abrir una sesion nueva");
          estado.classList.add("escaso");
        } else {
          estado.textContent = base;
          estado.classList.remove("escaso");
        }
        refrescarControles();
      }

      /**
       * Empezar de cero. Si hay conversacion en curso pide confirmacion
       * ANTES de descartarla, y la pide en linea: la aplicacion ya usa ese
       * idioma para aprobar una accion, y un dialogo nativo del navegador
       * bloquearia la pagina entera.
       */
      let pidiendoDescartar = false;

      function hayConversacion() {
        return sesionId !== null || historial.childElementCount > 0;
      }

      function pintarReinicio() {
        reinicio.hidden = pidiendoDescartar;
        avisoDescartar.hidden = !pidiendoDescartar;
        reinicioConfirmar.hidden = !pidiendoDescartar;
        reinicioCancelar.hidden = !pidiendoDescartar;
        reinicio.disabled = ocupado;
        reinicioConfirmar.disabled = ocupado;
      }

      function empezarDeCero() {
        pidiendoDescartar = false;
        // El estado de la sesion vive en el servidor; aqui solo se suelta
        // la referencia. La sesion vieja caduca sola por inactividad.
        sesionId = null;
        esperandoConfirmacion = null;
        historial.replaceChildren();
        bloque.classList.remove("visible");
        entrada.value = "";
        estado.textContent = "sesion nueva";
        refrescarControles();
        entrada.focus();
      }

      function refrescarControles() {
        pintarReinicio();
        const bloqueado = ocupado || Boolean(esperandoConfirmacion);
        entrada.disabled = bloqueado;
        enviar.disabled = bloqueado;
        document.getElementById("confirmar").disabled = ocupado;
        document.getElementById("denegar").disabled = ocupado;
        trabajando.classList.toggle("visible", ocupado);
      }

      async function hablar(cuerpo) {
        ocupado = true;
        refrescarControles();
        try {
          const respuesta = await fetch("/api/chat", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(
              sesionId === null ? cuerpo : { sesionId, ...cuerpo },
            ),
          });
          const datos = await respuesta.json();
          if (datos && datos.error) {
            pintarEvento({ tipo: "error", texto: datos.error });
            return;
          }
          if (datos && datos.sesionId) {
            sesionId = datos.sesionId;
          }
          pintar(datos);
        } catch {
          pintarEvento({
            tipo: "error",
            texto:
              "No se pudo hablar con el servidor. Comprueba que sigue levantado y vuelve a intentarlo.",
          });
        } finally {
          ocupado = false;
          refrescarControles();
        }
      }

      reinicio.addEventListener("click", () => {
        if (ocupado) {
          return;
        }
        // Sin conversacion no hay nada que descartar: se reinicia directo.
        if (!hayConversacion()) {
          empezarDeCero();
          return;
        }
        pidiendoDescartar = true;
        pintarReinicio();
      });

      reinicioConfirmar.addEventListener("click", () => {
        if (ocupado) {
          return;
        }
        empezarDeCero();
      });

      reinicioCancelar.addEventListener("click", () => {
        pidiendoDescartar = false;
        pintarReinicio();
      });

      formulario.addEventListener("submit", (evento) => {
        evento.preventDefault();
        const texto = entrada.value.trim();
        if (texto === "" || ocupado || esperandoConfirmacion) {
          return;
        }
        entrada.value = "";
        hablar({ mensaje: texto });
      });

      document.getElementById("confirmar").addEventListener("click", () => {
        if (!esperandoConfirmacion || ocupado) {
          return;
        }
        hablar({ confirmacion: { aprobada: true } });
      });

      document.getElementById("denegar").addEventListener("click", () => {
        if (!esperandoConfirmacion || ocupado) {
          return;
        }
        hablar({
          confirmacion: { aprobada: false, motivo: "denegada por el humano" },
        });
      });

      refrescarControles();
    </script>
  </body>
</html>
